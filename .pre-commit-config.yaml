repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.34.1
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: local
    hooks:
      - id: migrations
        name: check migrations
        entry: python manage.py check
        language: python
        files: \.py$

  - repo: local
    hooks:

      - id: generate_tree
        name: generate tree
        entry: >
          bash -c "tree-generator -o ./auto/project_structure.txt"
        language: system

      - id: file_merger
        name: merge files
        entry: >
          bash -c "file-merger -d ./blog/models -o ./auto/all_models.txt &&
          file-merger -d ./blog/templates -r -o ./auto/all_templates.txt &&
          file-merger -d ./blog/views -o ./auto/all_views.txt"
        language: system
